<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>상품 목록</title>
<style>
.top-nav-table {
	width: 100%;
	border-collapse: collapse;
	padding: 10px 0;
	table-layout: fixed;
	position: fixed;
	top: 0;
	left: 0;
	background-color: #fff8dc;
	z-index: 1000;
}

.top-nav-table td a {
	font-size: 10pt;
	text-decoration: none;
	color: black;
	padding: 0;
}

.top-nav-table td a:hover {
	color: yellow;
}

.top-nav-table .left {
	text-align: left;
	padding-left: 10px;
}

.top-nav-table .center {
	text-align: center;
	font-weight: bold;
	font-size: 18px;
}

.top-nav-table .right {
	text-align: right;
	padding-right: 10px;
}

.top-nav-table .right a {
	font-size: 5pt;
	margin: 0 5px;
	letter-spacing: -1px;
	white-space: nowrap;
}

.main-nav-table {
	width: 100%;
	border-collapse: collapse;
	text-align: center;
	position: fixed;
	top: 50px;
	left: 0;
	background-color: #fff8dc;
	z-index: 999;
}

.main-nav-table td {
	width: 16.66%;
}

.main-nav-table td a {
	display: block;
	padding: 5px 0;
	text-decoration: none;
	color: black;
}

.main-nav-table td a:hover {
	color: yellow;
}

body {
	font-family: Arial, sans-serif;
	background-color: #fff8dc;
	text-align: center;
	padding-top: 90px;
}

#page-title {
	color: #ff4500;
	margin-bottom: 20px;
}

#product-table {
	width: 90%;
	margin: 0 auto 30px auto;
	border-collapse: collapse;
	background-color: #fff5e6;
	border: 2px solid #ffa500;
	border-radius: 8px;
	overflow: hidden;
}

#product-table th, #product-table td {
	border: 1px solid #ffa500;
	padding: 8px 12px;
	text-align: center;
}

#product-table th {
	background-color: #ffdab9;
	font-weight: bold;
}

#product-table tr:nth-child(even) {
	background-color: #fff0d4;
}

#product-table tr:hover {
	background-color: #ffe4b5;
}

#product-table a {
	text-decoration: none;
	color: black;
}

#product-table a:hover {
	color: #ff4500;
}

button {
	padding: 8px 15px;
	background-color: #ff4500;
	color: white;
	border: none;
	border-radius: 5px;
	cursor: pointer;
	font-size: 12pt;
	margin: 5px;
	transition: background-color 0.3s;
}

button:hover {
	background-color: #ff7f50;
}
</style>
</head>
<body>

	<div th:replace="fragments/menu :: menu"></div>

	<h1 id="page-title">상품 목록</h1>

	<table border="1" id="product-table">
		<thead>
			<tr>
				<th>이미지</th>
				<th>ID</th>
				<th>이름</th>
				<th>가격</th>
				<th>설명</th>
				<th>재고</th>
				<th>액션</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="product : ${products}">
				<td>
					<div th:if="${product.imageUrl != null}">
						<img th:src="${product.imageUrl}" alt="상품 이미지" width="100" />
					</div>
					<div th:if="${product.imageUrl == null}">이미지 없음</div>
				</td>
				<td th:text="${product.productId}"></td>
				<td th:text="${product.name}"></td>
				<td th:text="${product.price}"></td>
				<td th:text="${product.description}"></td>
				<td th:text="${product.stock}"></td>
				<td><a
					th:href="@{'/admin/products/detail.fo?id=' + ${product.productId}}">
						<button type="button">상세보기</button>
				</a> <span
					th:if="${session.loginUser != null and session.loginUser.role.equalsIgnoreCase('ADMIN')}">
						<a
						th:href="@{'/admin/products/update.fo?id=' + ${product.productId}}">
							<button type="button">수정</button>
					</a>

						<form th:action="@{/admin/products/delete.fo}" method="post"
							style="display: inline;">
							<input type="hidden" name="id" th:value="${product.productId}" />
							<button type="submit" onclick="return confirm('정말 삭제하시겠습니까?');">삭제</button>
						</form>
				</span></td>
			</tr>
		</tbody>
	</table>

	<div
		th:if="${session.loginUser != null and session.loginUser.role.equalsIgnoreCase('ADMIN')}">
		<a th:href="@{/admin/products/create.fo}">
			<button type="button">상품 등록</button>
		</a>
	</div>

</body>
</html>
