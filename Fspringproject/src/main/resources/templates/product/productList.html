<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>상품 목록</title>
</head>
<body>
 <div th:replace="fragments/menu :: menu"></div>
<h2>상품 목록</h2>

<table border="1">
    <thead>
    <tr>
        <th>이미지</th>
        <th>ID</th>
        <th>이름</th>
        <th>가격</th>
        <th>설명</th>
        <th>재고</th>
        <th>액션</th>  <!-- 모든 사용자에게 보임 (상세보기는 공용 기능) -->
    </tr>
    </thead>

    <tbody>
    <tr th:each="product : ${products}">
        <td>
            <img th:src="@{${product.imageUrl}}"
                 th:if="${product.imageUrl != null}"
                 alt="상품 이미지" width="100"/>
            <span th:if="${product.imageUrl == null}">이미지 없음</span>
        </td>

        <td th:text="${product.productId}"></td>
        <td th:text="${product.name}"></td>
        <td th:text="${product.price}"></td>
        <td th:text="${product.description}"></td>
        <td th:text="${product.stock}"></td>

        <td>
            <!-- 🔵 모든 사용자 = 상세보기 -->
            <a th:href="@{'/admin/products/detail.fo?id=' + ${product.productId}}">
                <button type="button">상세보기</button>
            </a>

            <!-- 🔴 관리자만 = 수정 / 삭제 -->
            <span th:if="${session.loginUser != null and session.loginUser.role == 'ADMIN'}">

                <a th:href="@{'/admin/products/update.fo?id=' + ${product.productId}}">
                    <button type="button">수정</button>
                </a>

                <form th:action="@{/admin/products/delete.fo}"
                      method="post" style="display:inline;">
                    <input type="hidden" name="id" th:value="${product.productId}" />
                    <button type="submit" onclick="return confirm('정말 삭제하시겠습니까?');">
                        삭제
                    </button>
                </form>

            </span>
        </td>
    </tr>
    </tbody>
</table>

<!-- 🔴 관리자만 상품 등록 버튼 보이기 -->
<div th:if="${session.loginUser != null and session.loginUser.role == 'ADMIN'}" style="margin-top:20px;">
    <a th:href="@{/admin/products/create.fo}">
        <button type="button">상품 등록</button>
    </a>
</div>

</body>
</html>
