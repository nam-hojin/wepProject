<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring‑security">
<head>
    <meta charset="UTF-8">
    <title>상품 목록</title>
</head>
<body>
    <h2>상품 목록</h2>

    <table border="1">
        <thead>
            <tr>
                <th>이미지</th>
                <th>ID</th>
                <th>이름</th>
                <th>가격</th>
                <th>설명</th>
                <th>재고</th>
                <th sec:authorize="hasRole('ROLE_ADMIN')">액션</th> <!-- 관리자만 열 보이게 -->
            </tr>
        </thead>
        <tbody>
            <tr th:each="product : ${products}">
                <td>
                     <img th:src="@{${product.imageUrl}}" 
					         th:if="${product.imageUrl != null}" 
					         alt="상품 이미지" width="100"/>
					    <span th:if="${product.imageUrl == null}">이미지 없음</span>
				</td>
                </td>
                <td th:text="${product.productId}"></td>
                <td th:text="${product.name}"></td>
                <td th:text="${product.price}"></td>
                <td th:text="${product.description}"></td>
                <td th:text="${product.stock}"></td>
                <td sec:authorize="hasRole('ROLE_ADMIN')">
                    <a th:href="@{'/admin/products/detail.fo?id=' + ${product.productId}}">
					    <button type="button">상세보기</button>
					</a>
                    <a th:href="@{'/admin/products/update.fo?id=' + ${product.productId}}">
                        <button>수정</button>
                    </a>
                    <form th:action="@{/admin/products/delete.fo}" method="post" style="display:inline;">
                        <input type="hidden" name="id" th:value="${product.productId}" />
                        <button type="submit" onclick="return confirm('정말 삭제하시겠습니까?');">삭제</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <div sec:authorize="hasRole('ROLE_ADMIN')" style="margin-top:20px;">
        <a th:href="@{/admin/products/create.fo}">
            <button>상품 등록</button>
        </a>
    </div>
</body>
