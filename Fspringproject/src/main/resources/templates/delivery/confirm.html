<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>주문 완료</title>
    <style>
        /* ========================= */
        /* 상단 네비게이션 고정      */
        /* ========================= */
        .top-nav-table {
            width: 100%;
            border-collapse: collapse;
            padding: 10px 0;
            table-layout: fixed;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #fff8dc;
            z-index: 1000;
            border: none;
        }

        .top-nav-table td a {
            font-size: 10pt;
            text-decoration: none;
            color: black;
            padding: 0;
        }

        .top-nav-table td a:hover { color: yellow; }

        .top-nav-table .left { text-align: left; padding-left: 10px; }
        .top-nav-table .center { text-align: center; font-weight: bold; font-size: 18px; }
        .top-nav-table .right { text-align: right; padding-right: 10px; }
        .top-nav-table .right a { font-size: 5pt; margin: 0 5px; letter-spacing: -1px; white-space: nowrap; }

        /* ========================= */
        /* 메인 네비게이션 고정      */
        /* ========================= */
        .main-nav-table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            position: fixed;
            top: 50px;
            left: 0;
            background-color: #fff8dc;
            z-index: 999;
            border: none;
        }

        .main-nav-table td { width: 16.66%; }

        .main-nav-table td a {
            display: block;
            padding: 5px 0;
            text-decoration: none;
            color: black;
        }

        .main-nav-table td a:hover { color: yellow; }

        /* ========================= */
        /* 본문 패딩 확보            */
        /* ========================= */
        body {
            font-family: Arial, sans-serif;
            background-color: #fff8dc;
            text-align: center;
            padding-top: 90px;
        }

        /* ========================= */
        /* 페이지 타이틀             */
        /* ========================= */
        #page-title {
            color: #ff4500;
            margin-bottom: 30px;
        }

        /* ========================= */
        /* 버튼 스타일               */
        /* ========================= */
        button, a.button-link {
            display: inline-block;
            padding: 10px 20px;
            background-color: #ff4500;
            color: white;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            font-size: 12pt;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 20px;
        }

        button:hover, a.button-link:hover { background-color: #ff7f50; }
    </style>
</head>
<body>

<div th:replace="fragments/menu :: menu"></div>

<h1 id="page-title">주문이 완료되었습니다!</h1>

<a th:href="@{/main.to}" class="button-link">메인으로 돌아가기</a>

</body>
</html>
