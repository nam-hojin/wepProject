<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>결제 페이지</title>
<style>
.top-nav-table {
	width: 100%;
	border-collapse: collapse;
	padding: 10px 0;
	table-layout: fixed;
	position: fixed;
	top: 0;
	left: 0;
	background-color: #fff8dc;
	z-index: 1000;
	border: none;
	box-shadow: none;
}

.top-nav-table td {
	border: none;
}

.top-nav-table td a {
	font-size: 23pt;
	text-decoration: none;
	color: black;
	padding: 0;
}

.top-nav-table td a:hover {
	color: yellow;
}

.top-nav-table .left {
	text-align: left;
	padding-left: 10px;
}

.top-nav-table .center {
	text-align: center;
	font-weight: bold;
	font-size: 23px;
}

.top-nav-table .right {
	text-align: right;
	padding-right: 10px;
}

.top-nav-table .right a {
	font-size: 23pt;
	margin: 0 5px;
	letter-spacing: -1px;
	white-space: nowrap;
}

.main-nav-table {
	width: 100%;
	border-collapse: collapse;
	text-align: center;
	position: fixed;
	top: 50px;
	left: 0;
	background-color: #fff8dc;
	z-index: 999;
	border: none;
}

.main-nav-table td {
	width: 16.66%;
	border: none;
}

.main-nav-table td a {
	display: block;
	padding: 5px 0;
	text-decoration: none;
	color: black;
}

.main-nav-table td a:hover {
	color: yellow;
}

body {
	font-family: Arial, sans-serif;
	background-color: #fff8dc;
	text-align: center;
	padding-top: 90px;
}

#page-title {
	color: #ff4500;
	margin-bottom: 20px;
}

table {
	width: 90%;
	margin: 0 auto 30px auto;
	border-collapse: collapse;
	background-color: #fff5e6;
	border: 2px solid #ffa500;
	border-radius: 8px;
	overflow: hidden;
}

th, td {
	border: 1px solid #ffa500;
	padding: 8px 12px;
	text-align: center;
}

th {
	background-color: #ffdab9;
	font-weight: bold;
}

tr:nth-child(even) {
	background-color: #fff0d4;
}

tr:hover {
	background-color: #ffe4b5;
}

a {
	text-decoration: none;
	color: black;
}

a:hover {
	color: #ff4500;
}

button {
	padding: 8px 15px;
	background-color: #ff4500;
	color: white;
	border: none;
	border-radius: 5px;
	cursor: pointer;
	font-size: 12pt;
	margin: 5px;
	transition: background-color 0.3s;
}

button:hover {
	background-color: #ff7f50;
}

.info-table {
	width: 50%;
	margin: 20px auto;
	border-collapse: collapse;
	border: 2px solid #ffa500;
	border-radius: 8px;
	overflow: hidden;
	background-color: #fff5e6;
}

.info-table th, .info-table td {
	border: 1px solid #ffa500;
	padding: 8px 12px;
	text-align: left;
}

.info-table th {
	background-color: #ffdab9;
	width: 40%;
}

input[type="text"] {
	padding: 5px;
	border: 1px solid #ffa500;
	border-radius: 4px;
	width: 100%;
}
</style>
</head>
<body>


	<div th:replace="fragments/menu :: menu"></div>

	<h1 id="page-title">주문 상품 확인 / 결제</h1>


	<table border="1">
		<thead>
			<tr>
				<th>상품명</th>
				<th>가격</th>
				<th>수량</th>
				<th>합계</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="item : ${items}">
				<td th:text="${item.productName}"></td>
				<td th:text="${item.price}"></td>
				<td th:text="${item.quantity}"></td>
				<td th:text="${item.price * item.quantity}"></td>
			</tr>
		</tbody>
	</table>

	<p>
		<strong>총 금액: </strong><span th:text="${totalPrice}"></span> 원
	</p>


	<form th:action="@{/order/pay}" method="post">
		<table class="info-table">
			<tr>
				<th>카드 번호</th>
				<td><input type="text" name="cardNumber"
					placeholder="1234-5678-9012-3456" required
					pattern="\d{4}-\d{4}-\d{4}-\d{4}"></td>
			</tr>
			<tr>
				<th>유효기간 (MM/YY)</th>
				<td><input type="text" name="expiry" placeholder="MM/YY"
					required pattern="\d{2}/\d{2}"></td>
			</tr>
			<tr>
				<th>CVC</th>
				<td><input type="text" name="cvc" placeholder="123" required
					pattern="\d{3}"></td>
			</tr>
			<tr>
				<th>배송 주소</th>
				<td><input type="text" name="address"
					placeholder="배송 받을 주소를 입력하세요" required></td>
			</tr>
			<tr>
				<td colspan="2" style="text-align: center;">
					<button type="submit">결제하기</button>
				</td>
			</tr>
		</table>
	</form>

	<a th:href="@{/main.to}">
		<button id="home-btn">홈으로</button>
	</a>

</body>
</html>
