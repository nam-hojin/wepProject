<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>배송정보 입력</title>
    <style>
        /* ========================= */
        /* 상단 네비게이션 고정      */
        /* ========================= */
        .top-nav-table {
            width: 100%;
            border-collapse: collapse;
            padding: 10px 0;
            table-layout: fixed;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #fff8dc;
            z-index: 1000;
            border: none; /* 메뉴 선 제거 */
        }

        .top-nav-table td a {
            font-size: 10pt;
            text-decoration: none;
            color: black;
            padding: 0;
        }

        .top-nav-table td a:hover { color: yellow; }

        .top-nav-table .left { text-align: left; padding-left: 10px; }
        .top-nav-table .center { text-align: center; font-weight: bold; font-size: 18px; }
        .top-nav-table .right { text-align: right; padding-right: 10px; }
        .top-nav-table .right a { font-size: 5pt; margin: 0 5px; letter-spacing: -1px; white-space: nowrap; }

        /* ========================= */
        /* 메인 네비게이션 고정      */
        /* ========================= */
        .main-nav-table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            position: fixed;
            top: 50px;
            left: 0;
            background-color: #fff8dc;
            z-index: 999;
            border: none; /* 메뉴 선 제거 */
        }

        .main-nav-table td { width: 16.66%; }

        .main-nav-table td a {
            display: block;
            padding: 5px 0;
            text-decoration: none;
            color: black;
        }

        .main-nav-table td a:hover { color: yellow; }

        /* ========================= */
        /* 본문 패딩 확보            */
        /* ========================= */
        body {
            font-family: Arial, sans-serif;
            background-color: #fff8dc;
            text-align: center;
            padding-top: 90px;
        }

        /* ========================= */
        /* 페이지 타이틀             */
        /* ========================= */
        #page-title {
            color: #ff4500;
            margin-bottom: 20px;
        }

        /* ========================= */
        /* 배송정보 테이블 스타일    */
        /* ========================= */
        #delivery-table {
            width: 90%;
            margin: 0 auto 30px auto;
            border-collapse: collapse;
            background-color: #fff5e6;
            border: 2px solid #ffa500;
            border-radius: 8px;
            overflow: hidden;
        }

        #delivery-table th, #delivery-table td {
            border: 1px solid #ffa500;
            padding: 8px 12px;
            text-align: center;
        }

        #delivery-table th {
            background-color: #ffdab9;
            font-weight: bold;
        }

        #delivery-table tr:nth-child(even) { background-color: #fff0d4; }
        #delivery-table tr:hover { background-color: #ffe4b5; }

        input[type="text"] {
            padding: 5px;
            border-radius: 4px;
            border: 1px solid #ffa500;
            width: 90%;
            text-align: center;
        }

        /* ========================= */
        /* 버튼 스타일               */
        /* ========================= */
        button {
            padding: 8px 15px;
            background-color: #ff4500;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12pt;
            margin: 5px;
            transition: background-color 0.3s;
        }

        button:hover { background-color: #ff7f50; }
    </style>
</head>
<body>

<div th:replace="fragments/menu :: menu"></div>

<h1 id="page-title">배송정보 입력</h1>

<form th:action="@{/order/delivery}" th:object="${deliveryInfoForm}" method="post">
    <table id="delivery-table">
        <thead>
        <tr>
            <th>상품 ID</th>
            <th>수량</th>
            <th>수령인</th>
            <th>주소</th>
            <th>전화번호</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="dto, iterStat : ${deliveryInfoForm.deliveryInfoDTOs}">
            <td>
                <input type="hidden" th:field="*{deliveryInfoDTOs[__${iterStat.index}__].itemId}" />
                <input type="hidden" th:field="*{deliveryInfoDTOs[__${iterStat.index}__].productId}" />
                <input type="hidden" th:field="*{deliveryInfoDTOs[__${iterStat.index}__].quantity}" />
                <span th:text="${dto.productId}"></span>
            </td>
            <td><span th:text="${dto.quantity}"></span></td>
            <td><input type="text" th:field="*{deliveryInfoDTOs[__${iterStat.index}__].recipientName}" required /></td>
            <td><input type="text" th:field="*{deliveryInfoDTOs[__${iterStat.index}__].address}" required /></td>
            <td><input type="text" th:field="*{deliveryInfoDTOs[__${iterStat.index}__].phone}" required /></td>
        </tr>
        </tbody>
    </table>
    <button type="submit">주문 완료</button>
</form>

</body>
</html>
