<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원관리</title>
    <link rel="stylesheet" th:href="@{/css/userList.css}">
</head>
<body>

    <h2 id="page-title">관리자 회원관리 페이지</h2>

    <table border="1" id="user-table">
        <thead>
            <tr>
                <th id="th-userId">회원ID</th>
                <th id="th-username">아이디</th>
                <th id="th-password">비밀번호</th>
                <th id="th-name">이름</th>
                <th id="th-phone">전화번호</th>
                <th id="th-email">이메일</th>
                <th id="th-birth">생년월일</th>
                <th id="th-gender">성별</th>
                <th id="th-role">권한</th>
            </tr>
        </thead>
        <tbody id="user-tbody">
            <tr th:each="user : ${users}" class="user-row">
                <td th:text="${user.userId}" class="user-id"></td>
                <td th:text="${user.userName}" class="user-username"></td>
                <td th:text="${user.userPassword}" class="user-password"></td>
                <td th:text="${user.name}" class="user-name"></td>
                <td th:text="${user.phone}" class="user-phone"></td>
                <td th:text="${user.email}" class="user-email"></td>
                <td th:text="${user.birth}" class="user-birth"></td>
                <td th:text="${user.gender}" class="user-gender"></td>
                <td th:text="${user.role}" class="user-role"></td>
            </tr>
        </tbody>
    </table>

    <a th:href="@{/main.to}" id="home-link">메인으로</a>

</body>
</html>
