<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>리뷰 수정</title>
</head>
<body>
    <h1>리뷰 수정</h1>

    <form th:action="@{/edit2.go}" th:object="${review}" method="post">
        <input type="hidden" th:field="*{id}" />

        <label>사용자 ID:
            <input type="number" th:field="*{userId}" required />
        </label><br />

        <label>사용자 이름:
            <input type="text" th:field="*{userName}" required />
        </label><br />

        <label>비밀번호:
            <input type="password" th:field="*{userPassword}" required />
        </label><br />

        <label>내용:
            <textarea th:field="*{content}" required></textarea>
        </label><br />

        <button type="submit">수정 완료</button>
    </form>

    <a th:href="@{/reviews.go}">취소</a>
</body>
</html>
