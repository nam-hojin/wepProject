<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>리뷰 작성</title>
</head>
<body>
    <h1>리뷰 작성</h1>
    <form th:action="@{/create1.go}" th:object="${newReview}" method="post">
        <label>사용자 ID: <input type="number" th:field="*{userId}" required /></label><br />
        <label>사용자 이름: <input type="text" th:field="*{userName}" required /></label><br />
        <label>비밀번호: <input type="password" th:field="*{userPassword}" required /></label><br />
        <label>내용: <textarea th:field="*{content}" required></textarea></label><br />
        <button type="submit">작성</button>
    </form>
    <a th:href="@{/reviews.go}">취소</a>
</body>
</html>
