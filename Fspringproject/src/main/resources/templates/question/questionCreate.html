<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>자주하는 질문 작성</title>
<style>
.top-nav-table {
	width: 100%;
	border-collapse: collapse;
	padding: 10px 0;
	table-layout: fixed;
	position: fixed;
	top: 0;
	left: 0;
	background-color: #fff8dc;
	z-index: 1000;
}

.top-nav-table td {
	border: none;
}

.top-nav-table td a {
	font-size: 10pt;
	text-decoration: none;
	color: black;
	padding: 0;
}

.top-nav-table td a:hover {
	color: yellow;
}

.top-nav-table .left {
	text-align: left;
	padding-left: 10px;
}

.top-nav-table .center {
	text-align: center;
	font-weight: bold;
	font-size: 18px;
}

.top-nav-table .right {
	text-align: right;
	padding-right: 10px;
}

.top-nav-table .right a {
	font-size: 5pt;
	margin: 0 5px;
	letter-spacing: -1px;
	white-space: nowrap;
}

.main-nav-table {
	width: 100%;
	text-align: center;
	position: fixed;
	top: 50px;
	left: 0;
	background-color: #fff8dc;
	z-index: 999;
	border-collapse: collapse;
}

.main-nav-table td {
	width: 16.66%;
	border: none;
}

.main-nav-table td a {
	display: block;
	padding: 5px 0;
	text-decoration: none;
	color: black;
}

.main-nav-table td a:hover {
	color: yellow;
}

body {
	font-family: Arial, sans-serif;
	background-color: #fff8dc;
	text-align: center;
	padding-top: 90px;
}

#page-title {
	color: #ff4500;
	margin-bottom: 20px;
}

form {
	width: 60%;
	margin: 0 auto 30px auto;
	padding: 20px;
	background-color: #fff5e6;
	border: 2px solid #ffa500;
	border-radius: 8px;
	text-align: left;
}

form p {
	margin: 10px 0;
	font-size: 12pt;
}

form input[type="text"], form textarea {
	width: 100%;
	padding: 5px;
	font-size: 12pt;
	border: 1px solid #ffa500;
	border-radius: 4px;
}

form textarea {
	resize: vertical;
}

button {
	padding: 8px 15px;
	background-color: #ff4500;
	color: white;
	border: none;
	border-radius: 5px;
	cursor: pointer;
	font-size: 12pt;
	margin: 5px 0;
	transition: background-color 0.3s;
}

button:hover {
	background-color: #ff7f50;
}

a {
	text-decoration: none;
	color: black;
	font-size: 12pt;
}

a:hover {
	color: #ff4500;
}
</style>
</head>
<body>
	<div th:replace="fragments/menu :: menu"></div>

	<h1 id="page-title">질문 작성</h1>

	<form th:action="@{/question.eo/create.eo}" method="post">
		<p>
			제목: <input type="text" name="title" required>
		</p>
		<p>
			내용:
			<textarea name="content" required></textarea>
		</p>
		<p>
			작성자: <span th:text="${session.loginUser.name}"></span>
		</p>
		<button type="submit">작성</button>
	</form>

	

</body>
</html>

<a href="/question.eo/list.eo">
	<button>목록</button>
</a>

</body>
</html>
