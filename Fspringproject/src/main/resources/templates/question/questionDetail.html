<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>질문 상세</title>
<style>
.top-nav-table {
	width: 100%;
	border-collapse: collapse;
	padding: 10px 0;
	table-layout: fixed;
	position: fixed;
	top: 0;
	left: 0;
	background-color: #fff8dc;
	z-index: 1000;
}

.top-nav-table td a {
	font-size: 10pt;
	text-decoration: none;
	color: black;
	padding: 0;
}

.top-nav-table td a:hover {
	color: yellow;
}

.top-nav-table .left {
	text-align: left;
	padding-left: 10px;
}

.top-nav-table .center {
	text-align: center;
	font-weight: bold;
	font-size: 18px;
}

.top-nav-table .right {
	text-align: right;
	padding-right: 10px;
}

.top-nav-table .right a {
	font-size: 5pt;
	margin: 0 5px;
	letter-spacing: -1px;
	white-space: nowrap;
}

.main-nav-table {
	width: 100%;
	border-collapse: collapse;
	text-align: center;
	position: fixed;
	top: 50px;
	left: 0;
	background-color: #fff8dc;
	z-index: 999;
}

.main-nav-table td {
	width: 16.66%;
}

.main-nav-table td a {
	display: block;
	padding: 5px 0;
	text-decoration: none;
	color: black;
}

.main-nav-table td a:hover {
	color: yellow;
}

body {
	font-family: Arial, sans-serif;
	background-color: #fff8dc;
	text-align: center;
	padding-top: 90px;
}

#page-title {
	color: #ff4500;
	margin-bottom: 20px;
}

#question-table {
	width: 90%;
	margin: 0 auto 30px auto;
	border-collapse: collapse;
	background-color: #fff5e6;
	border: 2px solid #ffa500;
	border-radius: 8px;
	overflow: hidden;
}

#question-table th, #question-table td {
	border: 1px solid #ffa500;
	padding: 8px 12px;
	text-align: left;
	vertical-align: top;
}

#question-table th {
	background-color: #ffdab9;
	font-weight: bold;
	width: 20%;
}

#question-table tr:nth-child(even) {
	background-color: #fff0d4;
}

#question-table tr:hover {
	background-color: #ffe4b5;
}

button, a.button-link {
	padding: 8px 15px;
	background-color: #ff4500;
	color: white;
	border: none;
	border-radius: 5px;
	cursor: pointer;
	font-size: 12pt;
	margin: 5px;
	text-decoration: none;
	display: inline-block;
	transition: background-color 0.3s;
}

button:hover, a.button-link:hover {
	background-color: #ff7f50;
}

.btn-container {
	margin-top: 20px;
}

.btn-container a {
	text-decoration: none;
}
</style>
</head>
<body>


	<div th:replace="fragments/menu :: menu"></div>

	<h1 id="page-title">질문 상세</h1>

	<table id="question-table">
		<tr>
			<th>번호</th>
			<td th:text="${question.postId}"></td>
		</tr>
		<tr>
			<th>제목</th>
			<td th:text="${question.title}"></td>
		</tr>
		<tr>
			<th>작성자</th>
			<td th:text="${question.writer}"></td>
		</tr>
		<tr>
			<th>조회수</th>
			<td th:text="${question.viewCount}"></td>
		</tr>
		<tr>
			<th>작성일</th>
			<td
				th:text="${#dates.format(question.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
		</tr>
		<tr>
			<th>내용</th>
			<td th:text="${question.content}"></td>
		</tr>
	</table>

	<div class="btn-container">

		<div
			th:if="${session.loginUser != null and session.loginUser.role.equalsIgnoreCase('ADMIN')}">
			<a th:href="@{'/question.eo/update.eo/' + ${question.postId}}">
				<button type="button">수정</button>
			</a> <a th:href="@{'/question.eo/delete.eo/' + ${question.postId}}"
				onclick="return confirm('정말 삭제하시겠습니까?');">
				<button type="button">삭제</button>
			</a>
		</div>

		<a href="/question.eo/list.eo" class="button-link">
			<button type="button">목록</button>
		</a>
	</div>

</body>
</html>
