<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>질문 수정</title>
    <link rel="stylesheet" th:href="@{/css/notice.css}">
    
</head>
<body>
    <h1>질문 수정</h1>
    <form th:action="@{/question.eo/update.eo}" method="post">
        <input type="hidden" name="postId" th:value="${question.postId}">
        <p>제목: <input type="text" name="title" th:value="${question.title}" required></p>
        <p>내용: <textarea name="content" rows="5" cols="50" th:text="${question.content}" required></textarea></p>
        <p>작성자: <input type="text" name="writer" th:value="${question.writer}" required></p>
        <button type="submit">수정</button>
    </form>
    <br>
    <a href="/question.eo/list.eo">목록</a>
</body>
</html>
