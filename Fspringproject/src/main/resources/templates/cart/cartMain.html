<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>장바구니</title>
<style>
.top-nav-table {
	width: 100%;
	border-collapse: collapse;
	padding: 10px 0;
	table-layout: fixed;
	position: fixed;
	top: 0;
	left: 0;
	background-color: #fff8dc;
	z-index: 1000;
	border: none;
}

.top-nav-table td a {
	font-size: 23pt;
	text-decoration: none;
	color: black;
	padding: 0;
}

.top-nav-table td a:hover {
	color: yellow;
}

.top-nav-table .left {
	text-align: left;
	padding-left: 10px;
}

.top-nav-table .center {
	text-align: center;
	font-weight: bold;
	font-size: 23px;
}

.top-nav-table .right {
	text-align: right;
	padding-right: 10px;
}

.top-nav-table .right a {
	font-size: 23pt;
	margin: 0 5px;
	letter-spacing: -1px;
	white-space: nowrap;
}

.main-nav-table {
	width: 100%;
	border-collapse: collapse;
	text-align: center;
	position: fixed;
	top: 50px;
	left: 0;
	background-color: #fff8dc;
	z-index: 999;
	border: none;
}

.main-nav-table td {
	width: 16.66%;
}

.main-nav-table td a {
	display: block;
	padding: 5px 0;
	text-decoration: none;
	color: black;
}

.main-nav-table td a:hover {
	color: yellow;
}

body {
	font-family: Arial, sans-serif;
	background-color: #fff8dc;
	text-align: center;
	padding-top: 90px;
}

#page-title {
	color: #ff4500;
	margin-bottom: 20px;
}

#cart-table {
	width: 90%;
	margin: 0 auto 30px auto;
	border-collapse: collapse;
	background-color: #fff5e6;
	border: 2px solid #ffa500;
	border-radius: 8px;
	overflow: hidden;
}

#cart-table th, #cart-table td {
	border: 1px solid #ffa500;
	padding: 8px 12px;
	text-align: center;
}

#cart-table th {
	background-color: #ffdab9;
	font-weight: bold;
}

#cart-table tr:nth-child(even) {
	background-color: #fff0d4;
}

#cart-table tr:hover {
	background-color: #ffe4b5;
}

#cart-table a {
	text-decoration: none;
	color: black;
}

#cart-table a:hover {
	color: #ff4500;
}

button {
	padding: 8px 15px;
	background-color: #ff4500;
	color: white;
	border: none;
	border-radius: 5px;
	cursor: pointer;
	font-size: 12pt;
	margin: 5px;
	transition: background-color 0.3s;
}

button:hover {
	background-color: #ff7f50;
}

a {
	text-decoration: none;
	color: black;
	font-size: 12pt;
	margin: 0 5px;
}

a:hover {
	color: #ff4500;
}

input[type="checkbox"] {
	transform: scale(1.2);
	margin-left: 5px;
	margin-right: 5px;
}

form div, form span {
	margin: 5px 0;
}
</style>
</head>
<body>

	<div th:replace="fragments/menu :: menu"></div>

	<h1 id="page-title">장바구니</h1>


	<table id="cart-table">
		<thead>
			<tr>
				<th>상품 ID</th>
				<th>상품명</th>
				<th>가격</th>
				<th>수량</th>
				<th>추가일</th>
				<th>삭제</th>
			</tr>
		</thead>
		<tbody>
			<tr
				th:each="item : ${cart.items != null ? cart.items : #lists.emptyList()}">
				<td th:text="${item != null ? item.productId : 'N/A'}"></td>
				<td
					th:text="${productMap[item.productId] != null ? productMap[item.productId].name : '상품 없음'}"></td>
				<td
					th:text="${productMap[item.productId] != null ? productMap[item.productId].price + ' 원' : '-'}"></td>
				<td th:text="${item != null ? item.quantity : '-'}"></td>
				<td
					th:text="${item != null && item.addedAt != null ? #temporals.format(item.addedAt, 'yyyy-MM-dd HH:mm') : '-'}"></td>
				<td>
					<form th:action="@{/cart/remove}" method="post">
						<input type="hidden" name="productId" th:value="${item.productId}" />
						<button type="submit">삭제</button>
					</form>
				</td>
			</tr>
		</tbody>
	</table>


	<form th:action="@{/cart/clear}" method="post">
		<button type="submit">장바구니 전체 비우기</button>
	</form>


	<form th:action="@{/order/delivery}" method="get">
		<div
			th:each="item, iterStat : ${cart.items != null ? cart.items : #lists.emptyList()}">
			<input type="hidden"
				th:name="deliveryInfoDTOs[__${iterStat.index}__].itemId"
				th:value="${item.cartItemId}" /> <input type="hidden"
				th:name="deliveryInfoDTOs[__${iterStat.index}__].productId"
				th:value="${item.productId}" /> <input type="hidden"
				th:name="deliveryInfoDTOs[__${iterStat.index}__].quantity"
				th:value="${item.quantity}" /> <span
				th:text="${productMap[item.productId] != null ? productMap[item.productId].name : '상품 없음'}">상품명</span>
			/ <span
				th:text="${productMap[item.productId] != null ? productMap[item.productId].price : '-'}">가격</span>
			<input type="checkbox" th:name="selectedItemIds"
				th:value="${item.cartItemId}" /> 선택
		</div>
		<button type="submit">선택 상품 주문하기</button>
	</form>

	<br />
	<a th:href="@{/admin/products.fo}">상품 목록으로 돌아가기</a>

</body>
</html>
