<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>장바구니</title>
</head>
<body>

<h2>장바구니</h2>
<div th:replace="fragments/menu :: menu"></div>
<!-- cart.items가 null이면 빈 리스트로 처리 -->
<table border="1">
    <thead>
        <tr>
            <th>상품 ID</th>
            <th>상품명</th>
            <th>가격</th>
            <th>수량</th>
            <th>추가일</th>
            <th>삭제</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="item : ${cart.items != null ? cart.items : {}}">

            <!-- null 체크 -->
            <td th:text="${item != null ? item.productId : 'N/A'}"></td>
            <td th:text="${productMap != null && productMap[item.productId] != null ? productMap[item.productId].name : '상품 없음'}"></td>
            <td th:text="${productMap != null && productMap[item.productId] != null ? productMap[item.productId].price + ' 원' : '-'}"></td>
            <td th:text="${item != null ? item.quantity : '-'}"></td>
            <td th:text="${item != null && item.addedAt != null ? #temporals.format(item.addedAt, 'yyyy-MM-dd HH:mm') : '-'}"></td>
            <td>
                <form th:action="@{/cart/remove}" method="post">
                    <input type="hidden" name="productId" th:value="${item.productId}" />
                    <button type="submit">삭제</button>
                </form>
            </td>
        </tr>
    </tbody>
</table>

<!-- 장바구니 비우기 -->
<form th:action="@{/cart/clear}" method="post">
    <button type="submit">장바구니 전체 비우기</button>
</form>

<!-- 주문하기 버튼: 반복문 안에서 item 사용 -->
<form th:action="@{/order/delivery}" method="get">
    <div th:each="item, iterStat : ${cart.items}">
        <input type="hidden" th:name="deliveryInfoDTOs[__${iterStat.index}__].itemId" th:value="${item.cartItemId}" />
        <input type="hidden" th:name="deliveryInfoDTOs[__${iterStat.index}__].productId" th:value="${item.productId}" />
        <input type="hidden" th:name="deliveryInfoDTOs[__${iterStat.index}__].quantity" th:value="${item.quantity}" />

        <span th:text="${productMap[item.productId].name}">상품명</span> /
        <span th:text="${productMap[item.productId].price}">가격</span>

        <input type="checkbox" th:name="selectedItemIds" th:value="${item.cartItemId}" /> 선택
    </div>
    <button type="submit">선택 상품 주문하기</button>
</form>


<br/>
<a th:href="@{/admin/products.fo}">상품 목록으로 돌아가기</a>

</body>
</html>
